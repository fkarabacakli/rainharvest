# Local development stack. Credentials below are for local use only;
# override them with a .env file (see .env.example) if you like.
#
# Backend developers (API from the IDE):
#   docker compose up -d db mosquitto
#
# Everyone else, e.g. the panel developer (no .NET needed):
#   docker compose --profile full up -d --build
#   -> API + Scalar on http://localhost:5255, simulator sends data for node1 and node2

name: rainharvest

services:
  db:
    image: timescale/timescaledb:2.32.1-pg17
    environment:
      POSTGRES_DB: rainharvest
      POSTGRES_USER: ${POSTGRES_USER:-rainharvest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainharvest-dev}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.23
    environment:
      MQTT_API_USER: ${MQTT_API_USER:-api}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:-api-dev}
      MQTT_SIM_USER: ${MQTT_SIM_USER:-simulator}
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD:-simulator-dev}
    # The password file is generated from the variables above on every start,
    # so no hashed secrets live in the repository.
    entrypoint: ["/bin/sh", "/mosquitto/init.sh"]
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/init.sh:/mosquitto/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u $${MQTT_API_USER} -P $${MQTT_API_PASSWORD} -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: src/RainHarvest.Api/Dockerfile
    depends_on:
      db: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    environment:
      # Development = migrations on start, seed admin, Scalar, dev CORS origins
      # (all from appsettings.Development.json); only the hostnames change.
      ASPNETCORE_ENVIRONMENT: Development
      # GSS encryption off: no Kerberos here, and the slim runtime image lacks libgssapi.
      ConnectionStrings__Database: Host=db;Port=5432;Database=rainharvest;Username=${POSTGRES_USER:-rainharvest};Password=${POSTGRES_PASSWORD:-rainharvest-dev};Gss Encryption Mode=Disable
      Mqtt__Host: mosquitto
      Mqtt__Username: ${MQTT_API_USER:-api}
      Mqtt__Password: ${MQTT_API_PASSWORD:-api-dev}
      # Extra panel origin, e.g. PANEL_ORIGIN=http://localhost:8081 in .env
      Cors__AllowedOrigins__3: ${PANEL_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-5255}:8080" # same URL as `dotnet run`, so the panel config does not change
    restart: unless-stopped

  simulator:
    profiles: [full]
    build:
      context: .
      dockerfile: tools/RainHarvest.DeviceSimulator/Dockerfile
    depends_on:
      mosquitto: { condition: service_healthy }
      api: { condition: service_started }
    # Change devices/scenario here (or with SIM_* in .env); see --help for all options.
    command:
      - --host
      - mosquitto
      - --user
      - ${MQTT_SIM_USER:-simulator}
      - --password
      - ${MQTT_SIM_PASSWORD:-simulator-dev}
      - --devices
      - ${SIM_DEVICES:-node1,node2}
      - --scenario
      - ${SIM_SCENARIO:-normal}
      - --interval
      - ${SIM_INTERVAL:-5}
      - --speed
      - ${SIM_SPEED:-10}
    # Gives devices time to publish "offline" on `docker compose stop`.
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  db-data:
